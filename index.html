function renderFlipLog() {
  const el = $('#flog'); if (!el) return;
  const profit = flipProfit;
  const now = Date.now(), sum = since => flipLog.filter(f => f.t >= since).reduce((a, f) => a + profit(f), 0);
  const day0 = hstStart();
  const per = {};
  for (const f of flipLog) { per[f.name] = per[f.name] || { p: 0, n: 0 }; per[f.name].p += profit(f); per[f.name].n++; }
  const best = Object.entries(per).sort((a, b) => b[1].p - a[1].p).slice(0, 5);
  const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${signed(v)}</div></div>`;
  el.innerHTML = `<div class="sec" style="margin-top:28px">Flip log</div>
    ${!flipLog.length ? '<div class="note">No flips logged yet. Open a shard and use “Log a flip” once you’ve sold. After a week you’ll see which shards are your shards.</div>' : `
    <div class="totals">${stat('Today', sum(+day0))}${stat('Last 7 days', sum(now - 7 * 864e5))}${stat('All time', sum(0))}</div>
    ${best.length > 1 ? `<div class="note" style="margin-bottom:8px">Your best flips: ${best.map(([n, v]) => `${esc(n)} (${short(v.p)} over ${v.n})`).join(' · ')}</div>` : ''}
    <table><thead><tr><th>Date</th><th>Shard</th><th>Qty</th><th>Bought @</th><th>Sold @</th><th>Profit</th><th></th></tr></thead><tbody>
    ${flipLog.slice().reverse().map(f => `<tr><td class="dim">${new Date(f.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td><td>${esc(f.name)}</td><td>${f.qty}</td><td>${price(f.buy)}</td><td>${price(f.sell)}</td><td>${signed(profit(f))}</td><td class="del" data-del="${f.t}" title="Delete">✕</td></tr>`).join('')}
    </tbody></table>`}`;
}

function drawChart(pts, hoverX, prog = 1) {
  const c = $('#chart'); if (!c) return;

  const g = c.getContext('2d'); g.scale(dpr, dpr);
  if (pts.length < 2) { g.fillStyle = '#7b8492'; g.font = '12px Inter, Segoe UI'; g.textAlign = 'center'; g.fillText('Not enough history yet', W / 2, Hh / 2); return; }
  const vals = pts.flatMap(p => [p.b, p.s]).filter(ok);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const pad = { l: 8, r: 8, t: 22, b: 18 }, t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const X = t => pad.l + (t - t0) / (t1 - t0 || 1) * (W - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (Hh - pad.t - pad.b);
  g.fillStyle = '#7b8492'; g.font = '11px Inter, Segoe UI';
  g.fillText('High ' + short(hi), pad.l, 14); g.fillText('Low ' + short(lo), pad.l, Hh - 5);
  if (!c._anim) cancelAnimationFrame(c._raf);
  if (prog === 0) { const t0a = performance.now(); const step = now => { const k = Math.min(1, (now - t0a) / 700); c._anim = true; drawChart(pts, null, 1 - Math.pow(1 - k, 3)); c._anim = false; if (k < 1) c._raf = requestAnimationFrame(step); }; c._raf = requestAnimationFrame(step); prog = 0.001; }
  g.save(); g.beginPath(); g.rect(0, 0, pad.l + (W - pad.l - pad.r) * prog + 1, Hh); g.clip();
  for (const [key, col, dash] of [['b', '#f5c04a', []], ['s', '#5fb0ff', []]]) {
    const xy = pts.filter(p => ok(p[key])).map(p => [X(p.t), Y(p[key])]); if (!xy.length) continue;
    if (key === 'b') { const grd = g.createLinearGradient(0, pad.t, 0, Hh - pad.b); grd.addColorStop(0, 'rgba(245,192,74,.18)'); grd.addColorStop(1, 'rgba(245,192,74,0)');
      g.beginPath(); xy.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineTo(xy[xy.length - 1][0], Hh - pad.b); g.lineTo(xy[0][0], Hh - pad.b); g.closePath(); g.fillStyle = grd; g.fill(); }
    g.strokeStyle = col; g.lineWidth = 1.6; g.setLineDash(dash); g.lineJoin = 'round'; g.beginPath();
    xy.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  }
  g.restore(); g.setLineDash([]);
  if (hoverX != null) {
    const p = pts.reduce((a, b) => Math.abs(X(b.t) - hoverX) < Math.abs(X(a.t) - hoverX) ? b : a);
    const x = X(p.t);
    g.strokeStyle = '#4b5260'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, Hh - pad.b); g.stroke();
    [['b', '#f5c04a'], ['s', '#5fb0ff']].forEach(([k, col]) => { if (ok(p[k])) { g.fillStyle = col; g.fillRect(x - 2.5, Y(p[k]) - 2.5, 5, 5); } });
    const txt = new Date(p.t).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + '   buy ' + short(p.b) + '   sell ' + short(p.s);
    g.fillStyle = '#f0f2f5'; g.textAlign = 'right'; g.fillText(txt, W - pad.r, 14);
  }
  c.onmousemove = e => drawChart(pts, e.offsetX);
  c.onmouseleave = () => drawChart(pts);
}

// ---------- game sync: follow Minecraft's chat log (latest.log) for [Bazaar] messages ----------
// Hypixel's API doesn't expose your orders, but the game writes every chat line to logs/latest.log. Edge blocks AppData,

let STAB = { n: -1, f: () => null };

function readNBT(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), td = new TextDecoder(); let p0 = 0;

      case 3: { const v = dv.getInt32(p0); p0 += 4; return v; }
      case 4: { const v = Number(dv.getBigInt64(p0)); p0 += 8; return v; }
      case 5: { const v = dv.getFloat32(p0); p0 += 4; return v; }
      case 6: { const v = dv.getFloat64(p0); p0 += 8; return v; }

      case 10: { const o = {}; for (;;) { const tt = dv.getInt8(p0++); if (tt === 0) break; const nm = str(); o[nm] = read(tt); } return o; }

      case 12: { const n = dv.getInt32(p0); p0 += 4 + n * 8; return null; }

}

S.plan = Object.assign({ slots: 28, coins: '' }, S.plan || {});
function buildPlan() {

  const limitLeft = Math.max(0, S.limit - placedToday()), tax = S.tax / 100, share = S.share / 100, cands = [];
  const held = id => { const h = ME.hold && ME.hold.find(x => x.id === id); return h ? h.qty : 0; };
  for (const r of rows) {

      cands.push({ r, kind: 'Shard', qty: r.orderQty, unit: r.cost, cost: r.orderCost, profitHr: r.margin * r.orderQty / hrs, limit: r.orderCost + r.orderQty * r.sellAt });
    } else if (!r.flags.length && r.score >= 6.5 && r.marginPct <= 0.5) {

}

let statsRange = store.get('statsRange', 14);
const METHODS = { flip: ['Bazaar flips', '#f5c04a'], shard: ['Shards', '#c58bff'], craft: ['Craft flips', '#5fb0ff'] };

}

    <canvas id="statChart"></canvas>

  tip.style.display = 'block';
  const r = tip.getBoundingClientRect(), x = e.clientX + 16 + r.width > innerWidth ? e.clientX - r.width - 12 : e.clientX + 16;
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, Math.min(e.clientY + 12, innerHeight - r.height - 8)) + 'px';
});
pf.addEventListener('mouseleave', () => { const tip = $('#pfTip'); if (tip) tip.style.display = 'none'; });
})();

</script>

<script>
// Phone copy: slide-in menu, and no Windows notifications (there is no PC helper here).
(() => {
  const b = document.body, close = () => b.classList.remove('menu-open');
  document.getElementById('menuBtn').onclick = () => b.classList.toggle('menu-open');
  document.getElementById('navShade').onclick = close;
  document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a[data-v]')) close(); });
  window.winNotify = async () => false;
  try { if (S.alerts.desktop) { S.alerts.desktop = false; } } catch {}
  new MutationObserver(() => document.querySelectorAll('[data-a="desktop"]').forEach(i => i.closest('label')?.classList.add('pc-only')))
    .observe(document.getElementById('view'), { childList: true, subtree: true });
})();
</script>
</body>
